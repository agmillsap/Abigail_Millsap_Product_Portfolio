<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abigail Millsap | Product Portfolio</title>
<meta name="description" content="Interactive product case studies in decision intelligence, sales portfolio optimization, market opportunity, and ABIQ sports analytics.">
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#0a1930;background:#f4f7fb}
body{margin:0;min-height:100vh;display:grid;place-content:center;text-align:center}
section{max-width:420px;margin:24px;padding:36px;background:#fff;border:1px solid #dce5ef;border-radius:16px}
h1{font-size:24px;margin-bottom:10px}p{color:#62738a;line-height:1.5}.loading{font-size:14px;color:#163d75}.error{color:#ab2323}
</style>
</head>
<body>
<section id="loading"><h1>Abigail Millsap</h1><p>Product strategy · Decision intelligence · Interactive prototypes</p>
<p id="status" role="status" class="loading">Loading interactive portfolio…</p></section>
<script>
(async function(){
 try {
  if(!('fetch' in window)||!('Blob' in window))throw new Error('Your browser does not support this interactive portfolio.');
  const count=14;
  const paths=Array.from({length:count},(_,i)=>'./parts/'+String(i).padStart(2,'0')+'.part');
  const requests=paths.map(async (path)=>{
   const response=await fetch(path,{cache:'force-cache'});
   if(!response.ok)throw new Error('Unable to load portfolio content ('+response.status+').');
   return response.arrayBuffer();
  });
  const chunks=await Promise.all(requests);
  document.getElementById('status').textContent='Opening product dashboard…';
  const html=await new Blob(chunks,{type:'text/html;charset=utf-8'}).text();
  if(!html.toLowerCase().startsWith('<!doctype html>'))throw new Error('Portfolio content is incomplete.');
  // Preserve the user's original portfolio and demos; replace the external ABIQ app
  // with the always-available static showcase using the shared full-screen demo shell.
  // Update the two embedded enterprise-demo sidebars after their bundled
  // gzip payloads are expanded, preserving all other demos and original assets.
  const demoDecoder='async function getDemo(key){if(CACHE[key])return CACHE[key];CACHE[key]=await unpack(PACKED[key].data);return CACHE[key]}';
  const demoDecoderWithBranding=[
    "function stripSidebarBranding(key,source){",
    "  const css=key===\"field\"?\".side .logoCrop #logo{visibility:hidden!important}\":\".sidebar .logo-wrap img{clip-path:inset(51px 0 0 0)!important}\";",
    "  const marketChrome=key===\"market\"?\"/* Keep the sample-data disclosure and the dashboard header together. */\\nhtml,body{height:100%!important;overflow:hidden!important}\\nbody{padding-top:40px!important}\\n#app{height:calc(100vh - 40px)!important;min-height:0!important;overflow:hidden!important}\\n#app .sidebar{top:0!important;height:100%!important;min-height:0!important}\\n#app .main{height:100%!important;min-height:0!important;overflow:auto!important;position:relative}\\n#app .main>.toolbar{position:sticky!important;top:0!important;z-index:1000!important;margin-top:0!important;background:#fff!important;isolation:isolate}\":\"\";",
    "  const page=key===\"market\"?source.replace(/alt=\"Lowe[\\'’]s Pro Construction Insights\"/,'alt=\"Construction Insights\"'):source;",
    "  const fixedCharts=key===\"market\"?page.replace(/(renderDonut=function\\(\\)\\{\\s*)const t=/g,'$1let t='):page;",
    "  const withBrand=fixedCharts.replace(/<\\/head>/i,'<style id=\"portfolio-sidebar-branding\">'+css+'</style></head>');",
    "  return marketChrome?withBrand.replace(/<\\/body>/i,'<style id=\"portfolio-market-chrome-fix\">'+marketChrome+'</style></body>'):withBrand;",
    "}",
    "async function getDemo(key){if(CACHE[key])return CACHE[key];CACHE[key]=stripSidebarBranding(key,await unpack(PACKED[key].data));return CACHE[key]}"
  ].join('\n');
  if(!html.includes(demoDecoder))throw new Error('Demo integration format has changed; the original dashboard was not modified.');
  const branded=html.replace(demoDecoder,demoDecoderWithBranding);
  const heroPattern=/<section class="intro">[\s\S]*?<\/section>/;
  if(!heroPattern.test(branded))throw new Error('Portfolio introduction could not be located.');
  const redesigned=branded.replace(heroPattern,"<section class=\"intro\"><div class=\"shell heroLayout\"><div class=\"introKicker\">Product strategy · Decision intelligence · Workflow design</div><h1>Decision tools designed to solve <span>complex business problems</span></h1><p>Combining business strategy, analytics, and product design to define the problem, shape the workflow, and build interactive tools that help people move from information to action.</p><div class=\"heroFooter\"><div class=\"introMeta\"><span>Problem framing</span><span>Interactive prototyping</span><span>Analytics products</span><span>Enterprise workflows</span></div><a class=\"heroWorkLink\" href=\"#work\">View the projects <span aria-hidden=\"true\">↓</span></a></div></div></section>");
  // Keep the landing page lightweight: show faithful static thumbnails here.
  // Unpack only the selected interactive dashboard when its demo is opened.
  const staticPreviews={field:"<div class=\"previewViewport\"><div class=\"thumb-dashboard thumb-field\" aria-label=\"Representative Field Sales Portfolio Optimization dashboard preview\"><div class=\"thumb-alert\">SAMPLE DATA ONLY</div><div class=\"thumb-stage\"><div class=\"thumb-rail\"><strong>Portfolio Optimization</strong><span>Executive Summary</span><span>Hierarchy</span><span>Portfolio Map</span><span>Scenario Planning</span></div><div class=\"thumb-content\"><h4>Executive Summary</h4><div class=\"thumb-sub\">Seller portfolio planning · representative interface</div><div class=\"thumb-kpis\"><div class=\"thumb-kpi\"><b>Portfolio health</b><small>Managed sales &amp; capacity</small></div><div class=\"thumb-kpi\"><b>Territory fit</b><small>Geography &amp; accounts</small></div><div class=\"thumb-kpi\"><b>Opportunity</b><small>Account-level growth</small></div><div class=\"thumb-kpi\"><b>Scenarios</b><small>Feasibility &amp; trade-offs</small></div></div><div class=\"thumb-timeline\"><span>Hierarchy</span><span>Map views</span><span>Rebalance</span><span>Validate</span></div></div></div></div></div>",market:"<div class=\"previewViewport\"><div class=\"thumb-dashboard thumb-market\" aria-label=\"Representative Market Opportunity Navigator dashboard preview\"><div class=\"thumb-alert\">SAMPLE DATA ONLY</div><div class=\"thumb-stage\"><div class=\"thumb-rail\"><strong>Construction Insights</strong><span>Executive Summary</span><span>Market Opportunity</span><span>Builder Drilldown</span><span>Seller Portfolio</span></div><div class=\"thumb-content\"><h4>Executive Summary</h4><div class=\"thumb-sub\">U.S. new-home market · sample performance</div><div class=\"thumb-kpis\"><div class=\"thumb-kpi\"><b>$87.9M</b><small>Captured addressable spend</small></div><div class=\"thumb-kpi\"><b>$58.95B</b><small>Addressable spend</small></div><div class=\"thumb-kpi\"><b>2,563</b><small>Avg sq ft per new home</small></div><div class=\"thumb-kpi\"><b>5.3%</b><small>Market coverage</small></div></div><div class=\"thumb-timeline\"><span>Undeveloped</span><span>Clearing</span><span>Vacant lots</span><span>Build</span></div></div></div></div></div>"};
  let previewCount=0;
  const previewPattern=/<div class="previewViewport"><div class="previewLoading">Loading live sample-data preview…<\/div><iframe class="previewFrame" data-preview="(field|market)"[^>]*><\/iframe><\/div>/g;
  const previewed=redesigned.replace(previewPattern,(original,key)=>{previewCount++;return staticPreviews[key]||original;});
  if(previewCount!==2)throw new Error('Interactive preview replacement could not be confirmed.');
  const integrated=previewed
    .replace(/<\/head>/i,'<link rel="stylesheet" href="./portfolio-theme.css?v=20261103-dashboard-preview-fix"></head>')
    .replaceAll('https://abiq-sports.streamlit.app','./abiq/')
    .replace('>Open ABIQ</a>','>Open interactive demo</a>')
    .replaceAll('href="./abiq/" target="_blank" rel="noopener"','href="./abiq/"')
    .replace(/<\/body>/i,'<scr'+'ipt src="./abiq-embed.js?v=20261102-fullscreen"></scr'+'ipt></body>');
  if(!integrated.includes('href="./abiq/"'))throw new Error('ABIQ showcase integration could not be confirmed.');
  document.open();
  document.write(integrated);
  document.close();
 }catch(error){
  const status=document.getElementById('status');
  if(status){status.className='error';status.textContent=error.message||'Unable to load the dashboard.';}
 }
})();
</script>
</body></html>
